<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>與王陽明對話 | 知行合一</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts for typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="chat-header">
            <h1>王陽明</h1>
            <p class="subtitle">心即理也，天下又有心外之事，心外之理乎？</p>
        </header>

        <main class="chat-container" id="chat-container">
            <!-- Messages will be injected here -->
            <div class="message received">
                <div class="avatar">陽明</div>
                <div class="message-content">
                    <p>吾友，近來可好？凡有意欲處，即是物。若欲窮盡天下之理，須從心上用功。</p>
                </div>
            </div>
        </main>

        <footer class="input-container">
            <input type="text" id="user-input" placeholder="請問先生..." autocomplete="off">
            <button id="send-btn">請益</button>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
